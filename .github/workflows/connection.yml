name: Streamlit Keep Alive

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to keep app alive
        run: |
          # -m 30: 30-second timeout for waking up the app
          # -s: Silent mode (hides progress meter)
          # -o /dev/null: Discards response body to keep logs clean
          # --max-redirs 3: Prevents infinite redirect loops
          curl -m 30 -s -o /dev/null --max-redirs 3 https://app-12345.streamlit.app/