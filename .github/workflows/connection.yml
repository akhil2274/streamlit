name: Streamlit Keep Alive

on:
  schedule:
    # Every 4 hours; Streamlit sleeps apps after 12 hours without visits,
    # and GitHub may delay or skip scheduled runs, so leave headroom
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/scripts/requirements.txt

      # No "playwright install" needed: the script uses the runner's preinstalled Chrome
      - name: Install Playwright
        run: pip install -r .github/scripts/requirements.txt

      - name: Visit app in a headless browser
        run: python .github/scripts/keep_alive.py

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-failure
          path: keep_alive_failure.png
