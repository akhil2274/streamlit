name: Streamlit Keep Alive

on:
  schedule:
    # Runs every 6 hours UTC to keep the app active
    - cron: '* */6 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to keep app alive
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://app-12345.streamlit.app/'
          method: 'GET'