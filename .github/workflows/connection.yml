name: Streamlit Keep Alive

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to keep app alive
        run: |
          # Sends a GET request with a 30-second timeout (-m 30) 
          # and follows redirects (-L) in case Streamlit redirects the URL
          curl -m 30 -L -I https://app-12345.streamlit.app/