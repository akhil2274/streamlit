<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Without this tag mobile browsers render at ~980px and shrink everything -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akhil's Professional Assistant Bot 🤖</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100vh;
      height: 100dvh; /* accounts for mobile browser address bar */
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="https://app-12345.streamlit.app/?embed=true"
    title="Akhil's Professional Assistant Bot"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
